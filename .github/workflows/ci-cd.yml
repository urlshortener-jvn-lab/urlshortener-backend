name: Backend CI/CD — Build, Test & Push Image

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================================
  # STAGE 1: VALIDATE & BUILD (.NET 10)
  # ============================================================================
  validate:
    name: "CI: Restore & Build .NET 10 Solution"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}

      - name: Restore & Build Release
        run: |
          dotnet restore UrlShortener.slnx
          dotnet build UrlShortener.slnx --no-restore --configuration Release

  # ============================================================================
  # STAGE 2: BUILD & PUSH DOCKER IMAGE + UPDATE MANIFEST REPO (GitOps)
  # ============================================================================
  build-and-push:
    name: "CD: Build & Push urlshortener-api Image"
    needs: [validate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Backend Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Short SHA & Lowercase Owner
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/UrlShortener.API/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/urlshortener-api:${{ steps.vars.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/urlshortener-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Manifests Repo (GitOps Auto-Tag Update)
        env:
          MANIFEST_TOKEN: ${{ secrets.MANIFEST_REPO_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          NEW_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          if [ -z "$MANIFEST_TOKEN" ]; then
            echo "Chưa cấu hình MANIFEST_REPO_TOKEN, bỏ qua bước tự động cập nhật repo manifests."
            exit 0
          fi
          git clone https://x-access-token:${MANIFEST_TOKEN}@github.com/${OWNER}/urlshortener-manifests.git manifests
          cd manifests
          sed -i "s|backendTag:.*|backendTag: \"${NEW_TAG}\"|g" helm/urlshortener/values.yaml || true
          git config user.name "github-actions-bot"
          git config user.email "github-actions-bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet || (git commit -m "chore(gitops): update urlshortener-api image tag to ${NEW_TAG}" && git push)
